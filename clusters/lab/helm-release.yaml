---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lab1
  namespace: flux
spec:
  dependsOn:
    - name: traefik
      namespace: flux
    - name: cert-manager
      namespace: flux
  interval: 1m
  timeout: 5m
  releaseName: lab1
  targetNamespace: lab-app
  serviceAccountName: flux-applier
  chart:
    spec:
      chart: ./charts/lab1
      sourceRef:
        kind: GitRepository
        name: flux-fc
      reconcileStrategy: Revision
      interval: 1m
  install:
    createNamespace: true
  driftDetection:
    mode: enabled
  values:
    image:
      repository: "${ACR_LOGIN_SERVER}/devops-lab/lab1"
      tag: "sha-c91bb08b1afa3729529682a2f16c21d5af0d6106-42620587078-1"
    ingress:
      enabled: true
      className: traefik
      host: "${INGRESS_HOSTNAME}"
      clusterIssuer: letsencrypt-production
      tls:
        secretName: lab1-tls
