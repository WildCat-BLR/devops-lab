---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: lab1
  namespace: flux

spec:
  interval: 1m
  timeout: 5m

  releaseName: lab1
  targetNamespace: lab-app
  serviceAccountName: flux-applier

  chart:
    spec:
      chart: ./charts/lab1
      sourceRef:
        kind: GitRepository
        name: flux-fc
      reconcileStrategy: Revision
      interval: 1m

  install:
    createNamespace: true

  driftDetection:
    mode: enabled

  values:
    image:
      repository: acrkforgelab01.azurecr.io/devops-lab/lab1
      tag: "sha-fd07e6c86a05bcecf1bbd66180c4b8b14a8efc83-41487527763-1"