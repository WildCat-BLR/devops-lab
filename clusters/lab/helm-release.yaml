---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lab1
  namespace: flux
spec:
  dependsOn:
    - name: traefik
      namespace: flux
  interval: 1m
  timeout: 5m
  releaseName: lab1
  targetNamespace: lab-app
  serviceAccountName: flux-applier
  chart:
    spec:
      chart: ./charts/lab1
      sourceRef:
        kind: GitRepository
        name: flux-fc
      reconcileStrategy: Revision
      interval: 1m
  install:
    createNamespace: true
  driftDetection:
    mode: enabled
  values:
    image:
      repository: acrkforgelab01.azurecr.io/devops-lab/lab1
      tag: "sha-180bedddc87e71d258a6e129a0cdc91e82f890a5-41838985142-1"
    ingress:
      enabled: true
      className: traefik
      host: "${INGRESS_HOSTNAME}"
