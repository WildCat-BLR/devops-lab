---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lab1
  namespace: flux
spec:
  interval: 1m
  timeout: 5m
  releaseName: lab1
  targetNamespace: lab-app
  serviceAccountName: flux-applier
  chart:
    spec:
      chart: ./charts/lab1
      sourceRef:
        kind: GitRepository
        name: flux-fc
      reconcileStrategy: Revision
      interval: 1m
  install:
    createNamespace: true
  driftDetection:
    mode: enabled
  values:
    image:
      repository: acrkforgelab01.azurecr.io/devops-lab/lab1
      tag: "sha-da9cbac3f45ad53bb7bd99207e3ee44285be106e-41648314146-1"

    ingress:
      enabled: true
      className: traefik
      host: kforge-lab-ingress.eastus.cloudapp.azure.com
