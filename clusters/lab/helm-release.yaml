---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lab1
  namespace: flux
spec:
  dependsOn:
    - name: traefik
      namespace: flux

  interval: 1m
  timeout: 5m
  releaseName: lab1
  targetNamespace: lab-app
  serviceAccountName: flux-applier
  chart:
    spec:
      chart: ./charts/lab1
      sourceRef:
        kind: GitRepository
        name: flux-fc
      reconcileStrategy: Revision
      interval: 1m
  install:
    createNamespace: true
  driftDetection:
    mode: enabled
  values:
    image:
      repository: acrkforgelab01.azurecr.io/devops-lab/lab1
      tag: "sha-9dea8f0fd60490b19fce27f92d0d17f42dc9ecf2-41835848179-1"
    ingress:
      enabled: true
      className: traefik
      host: kforge-lab-ingress.eastus.cloudapp.azure.com
