---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lab1
  namespace: flux
spec:
  dependsOn:
    - name: traefik
      namespace: flux
  interval: 1m
  timeout: 5m
  releaseName: lab1
  targetNamespace: lab-app
  serviceAccountName: flux-applier
  chart:
    spec:
      chart: ./charts/lab1
      sourceRef:
        kind: GitRepository
        name: flux-fc
      reconcileStrategy: Revision
      interval: 1m
  install:
    createNamespace: true
  driftDetection:
    mode: enabled
  values:
    image:
      repository: "${ACR_LOGIN_SERVER}/devops-lab/lab1"
      tag: "sha-740d70e9ec7ae64730c0757d0bdea176bc755821-41843616330-1"
    ingress:
      enabled: true
      className: traefik
      host: "${INGRESS_HOSTNAME}"
