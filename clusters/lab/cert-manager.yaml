apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cert-manager
  namespace: flux
spec:
  type: oci
  url: oci://quay.io/jetstack/charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux
spec:
  interval: 10m
  timeout: 10m

  releaseName: cert-manager
  targetNamespace: cert-manager
  serviceAccountName: flux-applier

  chart:
    spec:
      chart: cert-manager
      version: "v1.21.3"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux
      interval: 1h

  install:
    createNamespace: true

  driftDetection:
    mode: enabled

  values:
    crds:
      enabled: true
      keep: true

    replicaCount: 1