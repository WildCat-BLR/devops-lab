apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux
spec:
  interval: 1h
  url: https://traefik.github.io/charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux
spec:
  interval: 10m
  timeout: 10m

  releaseName: traefik
  targetNamespace: traefik
  serviceAccountName: flux-applier

  chart:
    spec:
      chart: traefik
      version: "42.3.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux
      interval: 1h

  install:
    createNamespace: true

  driftDetection:
    mode: enabled

  values:
    deployment:
      replicas: 1

    ingressClass:
      enabled: true
      name: traefik
      isDefaultClass: false

    providers:
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true

    service:
      type: LoadBalancer
      annotations:
        service.beta.kubernetes.io/azure-pip-name: pip-lab-ingress

    ingressRoute:
      dashboard:
        enabled: false
