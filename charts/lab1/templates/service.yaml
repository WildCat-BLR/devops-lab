apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appname }}
  namespace: {{ .Values.targetNamespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Values.appname }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}