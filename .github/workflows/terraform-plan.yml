name: Terraform Plan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-lab-state
  cancel-in-progress: false

jobs:
  plan:
    name: Plan Azure infrastructure
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash
        working-directory: terraform

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check Azure authentication configuration
        run: |
          missing=0
          for name in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name. Configure AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID repository secrets."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1

      - name: Check Terraform formatting
        run: terraform fmt -check -diff -recursive

      - name: Initialize Terraform with Azure backend
        run: terraform init -input=false -lockfile=readonly

      - name: Validate Terraform
        run: terraform validate

      - name: Plan Terraform changes
        run: terraform plan -input=false -no-color -lock-timeout=60s
