name: Dockerfile CI

on:
  push:
    paths:
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '**/.dockerignore'
  pull_request:
    paths:
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '**/.dockerignore'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
